name: CI

on:
  push:
    branches:
      - devel
      - devel-alpha
      - devel-beta
      - devel-linux
      - devel-macos
      - devel-windows
      - main
      - "v0.2.x"
    tags:
      - "v*"
  pull_request:
    branches:
      - devel
      - devel-alpha
      - devel-beta
      - devel-linux
      - devel-macos
      - devel-windows
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-v3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: "1"
  ZIG_VERSION: "0.17.0"
  LLVM_VERSION: "22"
  FMT_VERSION: "11.2.0"
  BENCHMARK_VERSION: "1.10.0"
  WINDOWS_LLVM_VERSION: "23.1.3-1"
  WINDOWS_FMT_VERSION: "12.2.0-1"
  WINDOWS_BENCHMARK_VERSION: "1.10.0-1"

jobs:
  linux:
    name: Linux (Ubuntu 24.04)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch submodules over HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config binutils python3 \
            libtomlplusplus-dev catch2 liblua5.4-dev
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          . /etc/os-release
          echo "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-${LLVM_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-${LLVM_VERSION} llvm-${LLVM_VERSION} llvm-${LLVM_VERSION}-dev \
            libclang-${LLVM_VERSION}-dev libclang-cpp${LLVM_VERSION}-dev libclang-common-${LLVM_VERSION}-dev

      - name: Build pinned fmt
        run: |
          curl -fsSL -o fmt.tar.gz "https://github.com/fmtlib/fmt/archive/refs/tags/${FMT_VERSION}.tar.gz"
          tar xzf fmt.tar.gz
          cmake -S "fmt-${FMT_VERSION}" -B fmt-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFMT_TEST=OFF -DFMT_DOC=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/fmt"
          cmake --build fmt-build --target install --parallel 2

      - name: Build pinned Google Benchmark
        run: |
          curl -fsSL -o benchmark.tar.gz "https://github.com/google/benchmark/archive/refs/tags/v${BENCHMARK_VERSION}.tar.gz"
          tar xzf benchmark.tar.gz
          cmake -S "benchmark-${BENCHMARK_VERSION}" -B benchmark-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBENCHMARK_ENABLE_TESTING=OFF -DBENCHMARK_ENABLE_GTEST_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/benchmark"
          cmake --build benchmark-build --target install --parallel 2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Generate hotcache DLL source
        run: python3 tools/gen_hotcache_dll.py

      - name: Configure
        run: |
          LLVM_PREFIX="/usr/lib/llvm-${LLVM_VERSION}"
          cmake -S . -B build/Release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$LLVM_PREFIX;$RUNNER_TEMP/fmt;$RUNNER_TEMP/benchmark" \
            -DBUILD_TESTING=ON \
            -DBUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build/Release --parallel 2

      - name: Verify required build outputs
        run: |
          test -x build/Release/bin/test_all
          ctest --test-dir build/Release -N | grep -q abix-cmake-runtime-package-test

      - name: Test
        run: ctest --test-dir build/Release --output-on-failure --timeout 120

      - name: Install and verify the ABIX runtime package
        run: |
          cmake --install build/Release --prefix "$RUNNER_TEMP/abix-install"
          test -f "$RUNNER_TEMP/abix-install/lib/cmake/ABIX/ABIXConfig.cmake"

      - name: Build standalone AMC against runtime-only ABIX
        run: |
          LLVM_PREFIX="/usr/lib/llvm-${LLVM_VERSION}"
          cmake -S . -B build/runtime-only -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DABIX_BUILD_RUNTIME_ONLY=ON
          cmake --install build/runtime-only --prefix "$RUNNER_TEMP/abix-runtime-install"
          cmake -S AMC -B build/AMC-standalone -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DABIX_DIR="$RUNNER_TEMP/abix-runtime-install/lib/cmake/ABIX" \
            -DCMAKE_PREFIX_PATH="$LLVM_PREFIX;$RUNNER_TEMP/fmt;$RUNNER_TEMP/abix-runtime-install"
          cmake --build build/AMC-standalone --parallel 2
          ctest --test-dir build/AMC-standalone --output-on-failure --timeout 180

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-logs
          path: |
            build/Release/Testing/Temporary/LastTest.log
            build/Release/Testing/Temporary/LastTestsFailed.log
            build/Release/**/*.log
          if-no-files-found: ignore

  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch submodules over HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Install dependencies
        run: |
          brew install "llvm@${LLVM_VERSION}" cmake pkgconf tomlplusplus catch2 lua@5.4

      - name: Build pinned fmt
        run: |
          curl -fsSL -o fmt.tar.gz "https://github.com/fmtlib/fmt/archive/refs/tags/${FMT_VERSION}.tar.gz"
          tar xzf fmt.tar.gz
          cmake -S "fmt-${FMT_VERSION}" -B fmt-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFMT_TEST=OFF -DFMT_DOC=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/fmt"
          cmake --build fmt-build --target install --parallel 2

      - name: Build pinned Google Benchmark
        run: |
          curl -fsSL -o benchmark.tar.gz "https://github.com/google/benchmark/archive/refs/tags/v${BENCHMARK_VERSION}.tar.gz"
          tar xzf benchmark.tar.gz
          cmake -S "benchmark-${BENCHMARK_VERSION}" -B benchmark-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBENCHMARK_ENABLE_TESTING=OFF -DBENCHMARK_ENABLE_GTEST_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/benchmark"
          cmake --build benchmark-build --target install --parallel 2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Generate hotcache DLL source
        run: python3 tools/gen_hotcache_dll.py

      - name: Configure
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix lua@5.4)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          PREFIXES="$(brew --prefix "llvm@${LLVM_VERSION}");$RUNNER_TEMP/fmt;$RUNNER_TEMP/benchmark;$(brew --prefix tomlplusplus);$(brew --prefix catch2);$(brew --prefix lua@5.4)"
          cmake -S . -B build/Release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PREFIXES" \
            -DBUILD_TESTING=ON \
            -DBUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build/Release --parallel 2

      - name: Verify required build outputs
        run: |
          test -x build/Release/bin/test_all
          ctest --test-dir build/Release -N | grep -q abix-cmake-runtime-package-test

      - name: Test
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix lua@5.4)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          ctest --test-dir build/Release --output-on-failure --timeout 120

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-logs
          path: |
            build/Release/Testing/Temporary/LastTest.log
            build/Release/Testing/Temporary/LastTestsFailed.log
            build/Release/**/*.log
          if-no-files-found: ignore

  windows:
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch submodules over HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang=${{ env.WINDOWS_LLVM_VERSION }}
            mingw-w64-ucrt-x86_64-clang-tools-extra=${{ env.WINDOWS_LLVM_VERSION }}
            mingw-w64-ucrt-x86_64-llvm=${{ env.WINDOWS_LLVM_VERSION }}
            mingw-w64-ucrt-x86_64-fmt=${{ env.WINDOWS_FMT_VERSION }}
            mingw-w64-ucrt-x86_64-tomlplusplus
            mingw-w64-ucrt-x86_64-catch
            mingw-w64-ucrt-x86_64-benchmark=${{ env.WINDOWS_BENCHMARK_VERSION }}
            mingw-w64-ucrt-x86_64-lua54
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Generate hotcache DLL source
        shell: msys2 {0}
        run: python tools/gen_hotcache_dll.py

      - name: Configure
        shell: msys2 {0}
        run: |
          export CMAKE_PREFIX_PATH="$(cygpath -m "$MINGW_PREFIX")"
          cmake -S . -B build/Release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DBUILD_BENCHMARKS=ON

      - name: Build
        shell: msys2 {0}
        run: cmake --build build/Release --parallel 2

      - name: Build cross-toolchain DLL variants
        shell: msys2 {0}
        run: python tools/build_variants.py --build-type Release --with-msvc

      - name: Verify cross-toolchain variants
        shell: msys2 {0}
        run: |
          ls -R build/Release/bin/variants || true
          for tag in tool_x tool_y; do
            test -f "build/Release/bin/variants/$tag/version_dll/version_dll.dll" \
              || { echo "missing GCC/Clang variant: $tag"; exit 1; }
          done
          for dll in version_dll resource_dll interface_dll owner_dll; do
            test -f "build/Release/bin/variants/msvc_x64/$dll/$dll.dll" \
              || { echo "missing MSVC variant: $dll"; exit 1; }
          done

      - name: Verify required build outputs
        shell: msys2 {0}
        run: |
          test -f build/Release/bin/test_all.exe
          ctest --test-dir build/Release -N | grep -q abix-cmake-runtime-package-test

      - name: Test
        shell: msys2 {0}
        run: ctest --test-dir build/Release --output-on-failure --timeout 120

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs
          path: |
            build/Release/Testing/Temporary/LastTest.log
            build/Release/Testing/Temporary/LastTestsFailed.log
            build/Release/**/*.log
          if-no-files-found: ignore

  ci-status:
    name: CI status
    if: always()
    needs:
      - linux
      - macos
      - windows
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform job
        run: |
          test "${{ needs.linux.result }}" = "success"
          test "${{ needs.macos.result }}" = "success"
          test "${{ needs.windows.result }}" = "success"
