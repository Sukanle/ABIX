format:
  disable: false
  line_ending: unix
  line_width: 120
  tab_size: 4
  use_tabs: false
  fractional_tab_policy: use-space
  max_hanging_wrap_lines: 2
  max_hanging_wrap_positional_args: 6
  max_hanging_wrap_groups: 2
  max_rows_cmdline: 2
  always_wrap: []
  require_valid_layout: false
  dangle_parens: false
  dangle_align: prefix
  min_prefix_length: 4
  max_prefix_length: 10
  separate_ctrl_name_with_space: false
  separate_fn_name_with_space: false
  command_case: lower
  keyword_case: unchanged
  enable_sort: true
  autosort: false
markup:
  enable_markup: false
  first_comment_is_literal: false
  bullet_char: "*"
  enum_char: '.'
  fence_pattern: ^\s*([`~]{3}[`~]*)(.*)$
  ruler_pattern: ^\s*[^\w\s]{3}.*[^\w\s]{3}$
  hashruler_min_length: 10
  canonicalize_hashrulers: true
commands:
  foo:
    kwargs:
      DEPENDS:
        nargs: "*"
        sortable: false
        no_autosort: false
      HEADERS:
        nargs: "*"
        sortable: false
        no_autosort: false
      SOURCES:
        nargs: "*"
        sortable: false
        no_autosort: false
